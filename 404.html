<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Pagina no encontrada | Imponect</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <style>
        :root {
            --primary: #041E32;
            --accent: #DCCA65;
            --surface: #ffffff;
            --text: #1f2933;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem;
            font-family: Arial, sans-serif;
            background: var(--primary);
            color: var(--surface);
        }

        main {
            width: 100%;
            max-width: 42rem;
            text-align: center;
        }

        img {
            width: 6rem;
            height: 6rem;
            object-fit: contain;
            margin-bottom: 1.5rem;
        }

        h1 {
            margin: 0 0 1rem;
            font-size: clamp(2rem, 7vw, 4rem);
            line-height: 1.1;
        }

        p {
            margin: 0 auto 2rem;
            max-width: 32rem;
            color: #d8e1e8;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 3rem;
            padding: 0 1.5rem;
            border-radius: 999px;
            background: var(--accent);
            color: var(--text);
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main>
        <img src="/assets/optimized/logo-small-160.webp" width="160" height="160" alt="Logo Imponect">
        <h1>Pagina no encontrada</h1>
        <p>La URL que buscaste no existe o fue movida. Podes volver al inicio para seguir navegando por los servicios y catalogos de Imponect.</p>
        <a href="/">Volver al inicio</a>
    </main>
</body>
</html>
