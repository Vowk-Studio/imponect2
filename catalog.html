<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMPONECT | Catálogo 2026</title>
    <meta name="description" content="Catálogo general de productos innovadores importados por Imponect para el mercado argentino.">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#083948">
    <link rel="canonical" href="https://www.imponect.com/catalog.html">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Rajdhani:wght@500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Rajdhani:wght@500;600;700;800&display=swap"></noscript>
    <link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></noscript>
    
    <style>
        :root {
            --primary-blue: #083948;
            --primary-dark: #052630;
            --accent-gold: #b7812b;
            --accent-gold-dark: #9d6518;
            --bg-color: #0b1216;
            --text-white: #ffffff;
            --text-gray: #cfcfcf;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-white);
            margin: 0;
        }

        #main-wrapper {
            background-color: var(--bg-color);
            width: 100%;
            min-height: 100vh;
            padding-bottom: 60px;
            overflow: hidden; 
            position: relative;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--primary-dark) 100%);
            padding: 80px 20px 60px 20px; /* Más espacio arriba para que el botón no toque el título en móviles */
            text-align: center;
            border-bottom: 4px solid var(--accent-gold);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }

        /* --- BOTÓN DE IDIOMA AGRANDADO --- */
        .lang-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            background: rgba(0, 0, 0, 0.6); /* Un poco más oscuro para contraste */
            border: 2px solid var(--accent-gold); /* Borde más grueso */
            color: #fff;
            padding: 14px 30px; /* ÁREA DE TOQUE MUCHO MÁS GRANDE */
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 1.2rem; /* Letra más grande */
            transition: all 0.3s ease;
            z-index: 100;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .lang-btn:hover {
            background: var(--accent-gold);
            color: #000;
            transform: scale(1.05); /* Efecto leve de crecimiento */
        }
        .lang-text.active {
            color: #fff;
            text-decoration: underline;
            text-underline-offset: 4px;
        }
        .lang-text {
            opacity: 0.6;
        }
        .lang-text.active {
            opacity: 1;
            font-weight: 800; /* Extra bold para el seleccionado */
        }

        h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 3.8rem;
            text-transform: uppercase;
            letter-spacing: 6px;
            margin: 0;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        h1 span { color: var(--accent-gold); }

        .subtitle {
            margin-top: 10px;
            color: var(--accent-gold);
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.3rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 30px; 
        }

        /* BOTÓN DESCARGAR PDF */
        .btn-download-pdf {
            background: transparent;
            border: 2px solid var(--accent-gold);
            color: var(--text-white);
            padding: 16px 40px; 
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 50px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            font-size: 1.1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
            width: 340px; 
            z-index: 1;
        }

        .btn-download-pdf:hover {
            box-shadow: 0 0 20px rgba(183, 129, 43, 0.6);
            transform: translateY(-3px);
            background: rgba(183, 129, 43, 0.1);
        }

        .btn-download-pdf::before {
            content: '';
            position: absolute;
            top: 0; left: 0; bottom: 0;
            width: var(--progress, 0%);
            background-color: var(--accent-gold);
            z-index: -1;
            transition: width 0.1s linear; 
        }

        .btn-text { position: relative; z-index: 2; }
        .pdf-icon { font-size: 1.4rem; position: relative; top: 1px; right: 5px; }

        .catalog-container {
            max-width: 1250px;
            margin: 50px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 35px;
            justify-content: center;
            flex-grow: 1;
            align-content: start;
        }

        .product-card {
            background-color: #151a1e;
            border: 1px solid #2a3b45;
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .img-wrapper {
            width: 100%; height: 280px; background: #fff; padding: 20px;
            display: flex; align-items: center; justify-content: center; position: relative;
        }
        .img-wrapper::after {
            content: ''; position: absolute; bottom: 0; right: 0; width: 0; height: 0;
            border-style: solid; border-width: 0 0 40px 40px; border-color: transparent transparent var(--bg-color) transparent;
        }
        .img-wrapper img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.2)); }

        .info { padding: 25px; flex-grow: 1; display: flex; flex-direction: column; }
        .category-tag {
            font-family: 'Rajdhani', sans-serif; font-weight: 700; color: var(--accent-gold);
            font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;
        }
        .title {
            font-family: 'Rajdhani', sans-serif; font-size: 1.6rem; font-weight: 700;
            line-height: 1.1; margin-bottom: 12px; color: #fff;
        }
        .description {
            font-size: 0.95rem; color: var(--text-gray); line-height: 1.5; margin-bottom: 20px; flex-grow: 1;
        }
        .specs-box {
            background: rgba(8, 57, 72, 0.3); border-left: 3px solid var(--accent-gold);
            padding: 8px 12px; font-size: 0.85rem; color: #aed9e6; margin-bottom: 20px; font-family: 'Rajdhani', sans-serif;
        }
        
        .btn {
            display: block; width: 100%; text-align: center; background: transparent;
            border: 1px solid var(--accent-gold); color: var(--accent-gold); 
            padding: 14px;
            border-radius: 8px; text-transform: uppercase; font-weight: 700; letter-spacing: 1px;
            text-decoration: none; transition: 0.3s; font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
        }
        .btn:hover { background: var(--accent-gold); color: #000; box-shadow: 0 0 15px var(--accent-gold-dark); }
        
        footer { text-align: center; margin-top: auto; padding: 30px 0; border-top: 1px solid #333; color: #555; font-size: 0.9rem; }
        body.generating-pdf .product-card .btn { display: none !important; }
        /* Ocultar botón de idioma en PDF */
        body.generating-pdf .lang-btn { display: none !important; }
    </style>
</head>
<body id="body">

    <div id="main-wrapper">
        <header>
            <button id="lang-toggle-cat" class="lang-btn" type="button" aria-label="Cambiar idioma">
                <span class="lang-text active">ES</span> | <span class="lang-text">EN</span>
            </button>

            <h1 data-i18n="cat_header_title">IMPONECT</h1>
            <div class="subtitle" data-i18n="cat_header_subtitle">Productos Innovadores en ARGENTINA</div>
            
            <button class="btn-download-pdf" onclick="descargarPDF()" id="downloadBtn" type="button">
                <span class="btn-text"><i class="fas pdf-icon fa-file-pdf" aria-hidden="true"></i> <span data-i18n="btn_download">Descargar Catálogo PDF</span></span>
            </button>
        </header>

        <div class="catalog-container" id="grid"></div>

        <footer>
            <p>&copy; 2026 IMPONECT S.A. - <span data-i18n="footer_text">Catálogo General</span></p>
        </footer>
    </div>

    <script src="data.js"></script>

    <script>
        // TRADUCCIONES ESTÁTICAS
        const catalogTranslations = {
            es: {
                cat_header_title: "IMPONECT",
                cat_header_subtitle: "Productos Innovadores en ARGENTINA",
                btn_download: "Descargar Catálogo PDF",
                btn_card_action: "Ver Especificaciones",
                footer_text: "Catálogo General",
                status_processing: "Procesando...",
                status_ready: "¡Listo!",
                pdf_filename: "Catalogo_Imponect_General.pdf"
            },
            en: {
                cat_header_title: "IMPONECT",
                cat_header_subtitle: "Innovative Products in ARGENTINA",
                btn_download: "Download PDF Catalog",
                btn_card_action: "View Specifications",
                footer_text: "General Catalog",
                status_processing: "Processing...",
                status_ready: "Ready!",
                pdf_filename: "Imponect_General_Catalog.pdf"
            }
        };

        const langToggleBtn = document.getElementById('lang-toggle-cat');
        const langTexts = document.querySelectorAll('.lang-text');
        const container = document.getElementById('grid');
        const rutaImagenes = 'assets/catalog_images/optimized/';
        const rutaImagenesFallback = 'assets/catalog_images/';
        const html2PdfUrl = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
        let html2PdfPromise = null;

        // 1. INICIALIZAR IDIOMA
        let currentLang = localStorage.getItem('imponect_lang') || 'es';
        
        function updateUI() {
            const t = catalogTranslations[currentLang];

            // A. Actualizar botón ES | EN
            langTexts.forEach(span => {
                if(span.innerText === currentLang.toUpperCase()) span.classList.add('active');
                else span.classList.remove('active');
            });

            // B. Actualizar textos estáticos
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.textContent = t[key];
            });

            // C. RENDERIZAR PRODUCTOS
            renderProducts(currentLang);
        }

        // 2. FUNCIÓN PARA DIBUJAR TARJETAS
        function renderProducts(lang) {
            container.innerHTML = ''; // Limpiar grid

            if (typeof productos !== 'undefined' && Array.isArray(productos)) {
                const t = catalogTranslations[lang];
                
                productos.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    const imagenFinal = rutaImagenes + p.imagen.replace(/\.[^.]+$/, '.webp');
                    const imagenFallback = rutaImagenesFallback + p.imagen;

                    // Fallback
                    const categoria = lang === 'es' ? p.categoria_es : (p.categoria_en || p.categoria_es);
                    const nombre = lang === 'es' ? p.nombre_es : (p.nombre_en || p.nombre_es);
                    const specs = lang === 'es' ? p.specs_es : (p.specs_en || p.specs_es);
                    const descripcion = lang === 'es' ? p.descripcion_es : (p.descripcion_en || p.descripcion_es);

                    card.innerHTML = `
                        <div class="img-wrapper">
                            <img src="${imagenFinal}" alt="${nombre}" loading="lazy" decoding="async" width="600" height="600" style="border-radius:25px;" onerror="this.onerror=null;this.src='${imagenFallback}'">
                        </div>
                        <div class="info">
                            <div class="category-tag">${categoria}</div>
                            <h3 class="title">${nombre}</h3>
                            <div class="specs-box">${specs}</div>
                            <p class="description">${descripcion}</p>
                            <a href="#" class="btn">${t.btn_card_action}</a>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }
        }

        // 3. EVENTO CLICK
        langToggleBtn.addEventListener('click', () => {
            currentLang = currentLang === 'es' ? 'en' : 'es';
            localStorage.setItem('imponect_lang', currentLang);
            updateUI();
        });

        updateUI();

        function loadHtml2Pdf() {
            if (window.html2pdf) return Promise.resolve();
            if (html2PdfPromise) return html2PdfPromise;

            html2PdfPromise = new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = html2PdfUrl;
                script.async = true;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });

            return html2PdfPromise;
        }

        // 4. PDF
        async function descargarPDF() {
            const btn = document.getElementById('downloadBtn');
            const btnText = btn.querySelector('.btn-text');
            const wrapper = document.getElementById('main-wrapper');
            const t = catalogTranslations[currentLang];

            btn.disabled = true;
            btnText.innerHTML = `<i class="fas fa-cog fa-spin"></i> ${t.status_processing}`;

            try {
                await loadHtml2Pdf();
            } catch (error) {
                btn.disabled = false;
                btnText.innerHTML = `<i class="fas fa-file-pdf"></i> ${t.btn_download}`;
                return;
            }
            
            let progress = 0;
            const interval = setInterval(() => {
                if (progress < 90) {
                    progress += 4; 
                    btn.style.setProperty('--progress', progress + '%');
                    if (progress > 50) btn.style.color = '#000';
                }
            }, 80);

            document.body.classList.add('generating-pdf');

            const totalWidth = wrapper.offsetWidth;
            const actualHeight = wrapper.scrollHeight; 
            const minPortraitHeight = totalWidth * 1.41; 
            const finalHeight = Math.max(actualHeight, minPortraitHeight);

            const opt = {
                margin:       0,
                filename:     t.pdf_filename,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { 
                    scale: 2, useCORS: true, backgroundColor: '#0b1216', 
                    scrollY: 0, width: totalWidth, height: finalHeight, windowHeight: finalHeight,
                    ignoreElements: function(element) { return element.id === 'downloadBtn' || element.id === 'lang-toggle-cat'; }
                },
                jsPDF: { unit: 'px', format: [totalWidth, finalHeight], orientation: 'portrait' }
            };

            setTimeout(() => {
                html2pdf().set(opt).from(wrapper).save().then(() => {
                    clearInterval(interval);
                    btn.style.setProperty('--progress', '100%');
                    btnText.innerHTML = `<i class="fas fa-check"></i> ${t.status_ready}`;
                    setTimeout(() => {
                        btn.disabled = false;
                        btn.style.setProperty('--progress', '0%');
                        btn.style.color = '#fff';
                        btnText.innerHTML = `<i class="fas fa-file-pdf"></i> ${t.btn_download}`;
                        document.body.classList.remove('generating-pdf');
                    }, 2500);
                });
            }, 100);
        }
    </script>
</body>
</html>
