<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMPONECT | Catálogo Exclusivo 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary-blue: #083948;       
            --primary-dark: #052630;       
            --accent-gold: #b7812b;        
            --accent-gold-light: #e5b96e;  
            --accent-gold-dark: #9d6518;   
            --bg-color: #0b1216;           
            --text-white: #ffffff;
            --text-gray: #cfcfcf;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-white);
            margin: 0;
        }

        #main-wrapper {
            background-color: var(--bg-color);
            width: 100%;
            min-height: 100vh;
            padding-bottom: 60px;
            overflow: hidden;
            position: relative;
            background-image: linear-gradient(90deg, transparent 0%, transparent 49%, rgba(183, 129, 43, 0.05) 50%, transparent 51%, transparent 100%);
            background-size: 150px 100%; 
            display: flex;
            flex-direction: column;
        }

        header {
            background: radial-gradient(circle at center, #094557 0%, var(--primary-dark) 100%);
            padding: 90px 20px 70px 20px; /* Más aire arriba */
            text-align: center;
            border-bottom: 1px solid var(--accent-gold);
            position: relative;
            box-shadow: 0 10px 50px rgba(0,0,0,0.6);
        }

        header::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, var(--accent-gold-dark), var(--accent-gold-light), var(--accent-gold-dark));
        }

        /* --- BOTÓN DE IDIOMA AGRANDADO --- */
        .lang-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid var(--accent-gold-light);
            color: #fff;
            padding: 14px 30px; /* MÁS GRANDE */
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 1.2rem; /* FUENTE MÁS GRANDE */
            transition: all 0.3s ease;
            z-index: 100;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .lang-btn:hover { background: var(--accent-gold); color: #000; transform: scale(1.05); }
        .lang-text.active { color: #fff; text-decoration: underline; text-underline-offset: 4px; opacity: 1; font-weight: 800;}
        .lang-text { opacity: 0.6; }

        h1 {
            font-family: 'Rajdhani', sans-serif; font-size: 4.5rem; text-transform: uppercase;
            letter-spacing: 4px; margin: 0; line-height: 1;
        }
        h1 .brand { color: #fff; display: block; font-size: 2.8rem; letter-spacing: 8px; margin-bottom: 5px; }
        h1 .exclusive {
            background: linear-gradient(to bottom, #cf9d46 0%, #b7812b 50%, #7a5012 100%);
            background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-weight: 800; filter: drop-shadow(0 2px 0px rgba(0,0,0,0.5));
        }

        .subtitle {
            margin-top: 20px; color: var(--accent-gold-light); font-family: 'Playfair Display', serif;
            font-style: italic; font-size: 1.4rem; letter-spacing: 1px; opacity: 0.9; margin-bottom: 35px;
        }

        .btn-download-exclusive {
            background: transparent; border: 1px solid var(--accent-gold-light); color: var(--accent-gold-light);
            padding: 16px 45px;
            font-family: 'Rajdhani', sans-serif; font-weight: 700; text-transform: uppercase;
            cursor: pointer; border-radius: 4px; transition: all 0.2s ease; font-size: 1.1rem;
            display: inline-flex; align-items: center; justify-content: center; gap: 14px; letter-spacing: 1px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4); position: relative; overflow: hidden; width: 360px; z-index: 1;
        }
        .btn-download-exclusive::before {
            content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: var(--progress, 0%);
            background: linear-gradient(135deg, var(--accent-gold-dark) 0%, var(--accent-gold) 100%); z-index: -1; transition: width 0.1s linear;
        }
        .btn-text { position: relative; z-index: 2; }
        .pdf-icon { font-size: 1.4rem; position: relative; top: 1px; right: 5px;}
        .btn-download-exclusive:hover { box-shadow: 0 10px 30px rgba(183, 129, 43, 0.4); color: #fff; border-color: #fff; transform: translateY(-2px); }

        .catalog-container {
            max-width: 1250px; margin: 60px auto; padding: 0 20px; display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 45px;
            justify-content: center; flex-grow: 1; align-content: start; 
        }

        .product-card {
            background-color: rgba(21, 26, 30, 0.95); border: 1px solid var(--accent-gold-dark); border-radius: 12px;
            overflow: hidden; transition: all 0.4s ease; position: relative; display: flex; flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .ribbon {
            position: absolute; top: 15px; right: -30px;
            background: linear-gradient(90deg, var(--accent-gold-dark), var(--accent-gold));
            color: #000; font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 0.75rem;
            padding: 5px 30px; transform: rotate(45deg); z-index: 10; box-shadow: 0 2px 5px rgba(0,0,0,0.5); letter-spacing: 1px;
        }
        .product-card:hover { transform: translateY(-10px); border-color: var(--accent-gold-light); box-shadow: 0 20px 50px rgba(183, 129, 43, 0.25); }
        .img-wrapper {
            width: 100%; height: 300px; background: #fff; padding: 30px;
            display: flex; align-items: center; justify-content: center; position: relative; border-bottom: 1px solid var(--accent-gold);
        }
        .img-wrapper::after { content: ''; position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); width: 40px; height: 2px; background-color: var(--accent-gold); }
        .img-wrapper img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3)); }
        .info { padding: 30px; flex-grow: 1; display: flex; flex-direction: column; background: linear-gradient(to bottom, #151a1e 0%, #0d1012 100%); }
        .category-tag { font-family: 'Rajdhani', sans-serif; font-weight: 700; color: var(--accent-gold-light); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; display: inline-block; border-bottom: 1px solid var(--accent-gold-dark); align-self: flex-start; }
        .title { font-family: 'Rajdhani', sans-serif; font-size: 1.8rem; font-weight: 700; line-height: 1.1; margin-bottom: 15px; color: #fff; text-transform: uppercase; }
        .description { font-size: 0.95rem; color: var(--text-gray); line-height: 1.6; margin-bottom: 25px; flex-grow: 1; }
        .specs-box { background: rgba(183, 129, 43, 0.1); border: 1px solid rgba(183, 129, 43, 0.3); padding: 10px 15px; font-size: 0.85rem; color: #e5b96e; margin-bottom: 25px; font-family: 'Rajdhani', sans-serif; border-radius: 4px; }
        
        .btn { 
            display: block; width: 100%; text-align: center; background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-gold-dark) 100%); border: none; color: #000; 
            padding: 16px; 
            border-radius: 4px; text-transform: uppercase; font-weight: 700; letter-spacing: 2px; text-decoration: none; transition: 0.3s; font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
        }
        .btn:hover { background: linear-gradient(135deg, var(--accent-gold-light) 0%, var(--accent-gold) 100%); box-shadow: 0 0 20px rgba(183, 129, 43, 0.5); color: #000; transform: translateY(-2px); }

        footer { text-align: center; margin-top: auto; padding: 30px 0; border-top: 1px solid #333; color: #666; font-size: 0.9rem; position: relative; z-index: 2; }
        body.generating-pdf .product-card .btn { display: none !important; }
        /* Ocultar botón de idioma en PDF */
        body.generating-pdf .lang-btn { display: none !important; }
    </style>
</head>
<body id="body">

    <div id="main-wrapper">
        <header>
            <button id="lang-toggle-cat" class="lang-btn">
                <span class="lang-text active">ES</span> | <span class="lang-text">EN</span>
            </button>

            <h1>
                <span class="brand">IMPONECT</span>
                <span class="exclusive" data-i18n="cat_title_ex">EXCLUSIVOS</span>
            </h1>
            <div class="subtitle" data-i18n="cat_subtitle">Productos Innovadores en ARGENTINA</div>

            <button class="btn-download-exclusive" onclick="descargarPDF()" id="downloadBtn">
                <span class="btn-text"><i class="fas pdf-icon fa-file-pdf"></i><span data-i18n="btn_download">Descargar Catálogo PDF</span></span>
            </button>
        </header>

        <div class="catalog-container" id="grid"></div>

        <footer>
            <p>&copy; 2026 IMPONECT S.A. - <span data-i18n="footer_text">Catálogo de Productos Exclusivos</span></p>
        </footer>
    </div>

    <script src="data_exclusive.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script>
        const catalogTranslations = {
            es: {
                cat_title_ex: "EXCLUSIVOS",
                cat_subtitle: "Productos Innovadores en ARGENTINA",
                btn_download: "Descargar Catálogo PDF",
                btn_card_action: "Ver Detalles",
                footer_text: "Catálogo de Productos Exclusivos",
                status_processing: "Procesando...",
                status_downloaded: "¡Descargado!",
                status_ready_text: "Descargar Catálogo PDF",
                pdf_filename: "Catalogo_Exclusive_Imponect.pdf"
            },
            en: {
                cat_title_ex: "EXCLUSIVE",
                cat_subtitle: "Innovative Products in ARGENTINA",
                btn_download: "Download PDF Catalog",
                btn_card_action: "View Details",
                footer_text: "Exclusive Products Catalog",
                status_processing: "Processing...",
                status_downloaded: "Downloaded!",
                status_ready_text: "Download PDF Catalog",
                pdf_filename: "Imponect_Exclusive_Catalog.pdf"
            }
        };

        const langToggleBtn = document.getElementById('lang-toggle-cat');
        const langTexts = document.querySelectorAll('.lang-text');
        const container = document.getElementById('grid');
        const rutaImagenes = 'assets/catalog_exclusive/';

        let currentLang = localStorage.getItem('imponect_lang') || 'es';

        function updateUI() {
            const t = catalogTranslations[currentLang];

            // A. Botón
            langTexts.forEach(span => {
                if(span.innerText === currentLang.toUpperCase()) span.classList.add('active');
                else span.classList.remove('active');
            });

            // B. Estáticos
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.textContent = t[key];
            });

            // C. Renderizar tarjetas (usando productosExclusivos del js externo)
            renderProducts(currentLang);
        }

        function renderProducts(lang) {
            container.innerHTML = '';
            if (typeof productosExclusivos !== 'undefined' && Array.isArray(productosExclusivos)) {
                const t = catalogTranslations[lang];

                productosExclusivos.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    const imagenFinal = rutaImagenes + p.imagen;

                    // Fallback a español si no existe inglés
                    const categoria = lang === 'es' ? p.categoria_es : (p.categoria_en || p.categoria_es);
                    const nombre = lang === 'es' ? p.nombre_es : (p.nombre_en || p.nombre_es);
                    const specs = lang === 'es' ? p.specs_es : (p.specs_en || p.specs_es);
                    const descripcion = lang === 'es' ? p.descripcion_es : (p.descripcion_en || p.descripcion_es);

                    card.innerHTML = `
                        <div class="ribbon">OFFICIAL PARTNER</div>
                        <div class="img-wrapper">
                            <img src="${imagenFinal}" alt="${nombre}" onerror="this.src='https://via.placeholder.com/300x300?text=Exclusivo'"> 
                        </div>
                        <div class="info">
                            <div class="category-tag">${categoria}</div>
                            <h3 class="title">${nombre}</h3>
                            <div class="specs-box">${specs}</div>
                            <p class="description">${descripcion}</p>
                            <a href="#" class="btn">${t.btn_card_action}</a>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }
        }

        langToggleBtn.addEventListener('click', () => {
            currentLang = currentLang === 'es' ? 'en' : 'es';
            localStorage.setItem('imponect_lang', currentLang);
            updateUI();
        });

        updateUI();

        function descargarPDF() {
            const btn = document.getElementById('downloadBtn');
            const btnText = btn.querySelector('.btn-text');
            const wrapper = document.getElementById('main-wrapper');
            const t = catalogTranslations[currentLang];
            
            btn.disabled = true;
            btnText.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${t.status_processing}`;
            
            let progress = 0;
            const interval = setInterval(() => {
                if (progress < 90) {
                    progress += 4;
                    btn.style.setProperty('--progress', progress + '%');
                    if(progress > 40) btn.style.color = '#fff'; 
                }
            }, 80);

            document.body.classList.add('generating-pdf');

            const totalWidth = wrapper.offsetWidth;
            const actualHeight = wrapper.scrollHeight;
            const minPortraitHeight = totalWidth * 1.41; 
            const finalHeight = Math.max(actualHeight, minPortraitHeight);

            const opt = {
                margin:       0,
                filename:     t.pdf_filename,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { 
                    scale: 2, useCORS: true, backgroundColor: '#0b1216', 
                    scrollY: 0, width: totalWidth, height: finalHeight, windowHeight: finalHeight,
                    ignoreElements: function(element) { return element.id === 'downloadBtn' || element.id === 'lang-toggle-cat'; }
                },
                jsPDF: { unit: 'px', format: [totalWidth, finalHeight], orientation: 'portrait' }
            };

            setTimeout(() => {
                html2pdf().set(opt).from(wrapper).save().then(() => {
                    clearInterval(interval);
                    btn.style.setProperty('--progress', '100%');
                    btnText.innerHTML = `<i class="fas fa-check"></i> ${t.status_downloaded}`;
                    setTimeout(() => {
                        btn.disabled = false;
                        btn.style.setProperty('--progress', '0%');
                        btn.style.color = '#e5b96e'; 
                        btnText.innerHTML = `<i class="fas fa-crown"></i> ${t.status_ready_text}`;
                        document.body.classList.remove('generating-pdf');
                    }, 2500);
                });
            }, 100);
        }
    </script>
</body>
</html>
